      - name: Bibliotheken voor Excel en PDF downloaden
        run: |
          mkdir -p app/src/main/assets/lib
          curl -fsSL -o app/src/main/assets/lib/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          curl -fsSL -o app/src/main/assets/lib/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -fsSL -o app/src/main/assets/lib/jspdf.plugin.autotable.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js
          for f in DejaVuSans.ttf DejaVuSans-Bold.ttf; do
            curl -fsSL -o app/src/main/assets/lib/$f https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/$f \
              || curl -fsSL -o app/src/main/assets/lib/$f https://unpkg.com/dejavu-fonts-ttf@2.37.3/ttf/$f \
              || echo "Lettertype $f niet gevonden, pdf gebruikt dan gewone letters"
          done
          ls -la app/src/main/assets/lib

      - name: Android SDK onderdelen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: APK bouwen
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: Urenkalender-APK
          path: app/build/outputs/apk/release/*.apk
